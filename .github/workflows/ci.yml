name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    name: Contracts (build, test, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show toolchain versions
        run: |
          forge --version
          cast --version
          anvil --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

      - name: Generate coverage
        run: forge coverage --report summary --report lcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build frontend
        run: npm run build

  deploy-smoke:
    name: Deploy smoke test (anvil)
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Start anvil
        run: |
          anvil --port 8545 --silent &
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then
              echo "anvil is up"
              exit 0
            fi
            sleep 1
          done
          echo "anvil did not start" >&2
          exit 1

      - name: Deploy and seed
        run: |
          forge script script/Deploy.s.sol --rpc-url http://127.0.0.1:8545 --broadcast
          forge script script/SeedLiquidity.s.sol --rpc-url http://127.0.0.1:8545 --broadcast

      - name: Verify a swap end to end
        run: |
          ROUTER=$(jq -r .router deployments/31337.json)
          TOKEN_A=$(jq -r .tokenA deployments/31337.json)
          TOKEN_B=$(jq -r .tokenB deployments/31337.json)
          cast call "$ROUTER" "getAmountsOut(uint256,address[])(uint256[])" \
            100000000 "[\"$TOKEN_A\",\"$TOKEN_B\"]" --rpc-url http://127.0.0.1:8545
